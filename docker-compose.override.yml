services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/pytest.ini:/app/pytest.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"  # Docker Desktop on macOS needs polling for reliable change detection
      PYTHONDONTWRITEBYTECODE: "1"      # avoid __pycache__ writes that could conflict with host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # named volume so host's macOS files don't shadow Linux-built deps
      - frontend_next:/app/.next                 # ditto for .next build artifacts
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1  # browser-side calls hit host, not Docker DNS
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # next build's typecheck worker needs ~1GB heap; default ~256MB OOMs
      NODE_OPTIONS: "--max-old-space-size=1536"
    deploy:
      resources:
        limits:
          memory: 2048m  # overrides base 512m for dev — `next build` typecheck needs the headroom
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s  # npm install on first run takes ~60s

volumes:
  frontend_node_modules:
  frontend_next:
