services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/pytest.ini:/app/pytest.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"  # Docker Desktop on macOS needs polling for reliable change detection
      PYTHONDONTWRITEBYTECODE: "1"      # avoid __pycache__ writes that could conflict with host
