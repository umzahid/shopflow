groups:
  - name: shopflow
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[2m]) / rate(http_requests_total[2m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 5%"
          description: "Current error rate: {{ $value | humanizePercentage }}"

      - alert: HighP99Latency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 1s"
          description: "P99 latency is {{ $value }}s"

      - alert: ServiceDown
        expr: up{job="shopflow-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ShopFlow backend is down"
          description: "Backend has been unreachable for more than 1 minute"
