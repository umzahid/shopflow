name: ShopFlow Nightly (E2E + k6 + ZAP)

# Non-blocking hardening suite. Runs on a schedule (and on demand) — never on
# push/PR — so it cannot gate merges. It brings the full compose stack up and
# runs the three long/slow suites that the PR pipeline (test.yml) deliberately
# skips: Playwright E2E, a k6 smoke profile, and ZAP baseline scans.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly
  workflow_dispatch: {}    # manual trigger (Actions → Run workflow)

# One nightly run at a time; a manual run supersedes a queued scheduled one.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: E2E + k6 + ZAP against a live stack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Shared CI env + rate-limit overrides: the full E2E suite and the ZAP
      # scans all come from one client IP and would otherwise trip the limits.
      - name: Write CI .env for docker compose
        run: |
          cp .github/workflows/ci.env .env
          {
            echo "RATE_LIMIT_PUBLIC=1000000/minute"
            echo "RATE_LIMIT_AUTHENTICATED=1000000/minute"
          } >> .env

      - name: Build & start the full stack
        run: |
          docker compose up -d --build
          ./scripts/wait-for-health.sh http://localhost:8000/health 180 backend
          ./scripts/wait-for-health.sh http://localhost:3000/api/health 180 frontend

      - name: Run Alembic migrations
        run: docker compose exec -T backend alembic upgrade head

      # ── E2E (Playwright) ─────────────────────────────────────────────────
      - name: Install E2E deps + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright E2E
        id: e2e
        continue-on-error: true
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000/api/v1
        # --workers=2: the config notes unbounded parallelism overloads the
        # dev-mode stack (single-worker Next + reload-mode API) past ~30 tests.
        run: npx playwright test --workers=2

      # ── k6 smoke ─────────────────────────────────────────────────────────
      - name: k6 smoke
        id: k6
        continue-on-error: true
        run: ./perf/run.sh smoke

      # ── ZAP baseline (frontend + API) ────────────────────────────────────
      - name: ZAP baseline scans
        id: zap
        continue-on-error: true
        run: |
          ./security/zap-scan.sh frontend
          ./security/zap-scan.sh api

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

      - name: Upload k6 + ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-and-security-reports
          path: |
            perf/results/
            security/reports/
          if-no-files-found: ignore

      - name: Backend logs on failure
        if: failure() || steps.e2e.outcome == 'failure' || steps.k6.outcome == 'failure' || steps.zap.outcome == 'failure'
        run: docker compose logs --tail 200 backend frontend

      - name: Tear down
        if: always()
        run: docker compose down -v

      # Surface suite failures as a red job (visible in the Actions tab) without
      # blocking any PR — this workflow never runs on push/PR.
      - name: Fail if any suite failed
        if: always()
        run: |
          echo "E2E=${{ steps.e2e.outcome }} k6=${{ steps.k6.outcome }} ZAP=${{ steps.zap.outcome }}"
          if [ "${{ steps.e2e.outcome }}" = "failure" ] || \
             [ "${{ steps.k6.outcome }}" = "failure" ] || \
             [ "${{ steps.zap.outcome }}" = "failure" ]; then
            echo "::error::One or more nightly suites failed — see logs/artifacts above."
            exit 1
          fi
          echo "All nightly suites passed."
