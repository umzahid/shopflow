name: ShopFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend Lint ────────────────────────────────────────────────────────
  lint-backend:
    name: Lint (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint deps
        run: pip install flake8

      - name: flake8
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E501,W503,E203

  # ── 2. Frontend Lint ───────────────────────────────────────────────────────
  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  # ── 3. Backend Tests ───────────────────────────────────────────────────────
  test-backend:
    name: Pytest (unit + integration)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: shopflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopflow -d shopflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://shopflow:testpassword@localhost:5432/shopflow
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-use-64-chars-minimum-length
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      APP_ENV: test
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      SHOPFLOW_FAKE_EMBEDDINGS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U shopflow -d shopflow \
            -c "CREATE DATABASE shopflow_test;"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -p no:cacheprovider

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── 4. Frontend Tests ──────────────────────────────────────────────────────
  test-frontend:
    name: Vitest (frontend)
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

  # ── 5. Frontend Build ──────────────────────────────────────────────────────
  build-frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: test-frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ── 6. Docker Image Build ──────────────────────────────────────────────────
  build-images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: shopflow-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: shopflow-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ── 7. API Smoke Tests ─────────────────────────────────────────────────────
  smoke:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env for docker compose
        run: |
          {
            echo "APP_ENV=ci"
            echo "DEBUG=false"
            echo "POSTGRES_PASSWORD=testpassword"
            echo "DATABASE_URL=postgresql+asyncpg://shopflow:testpassword@postgres:5432/shopflow"
            echo "REDIS_PASSWORD=testredis"
            echo "REDIS_URL=redis://:testredis@redis:6379/0"
            echo "JWT_SECRET_KEY=ci-test-secret-key-not-for-production-use-64-chars-minimum-xxxx"
            echo "JWT_ALGORITHM=HS256"
            echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15"
            echo "JWT_REFRESH_TOKEN_EXPIRE_DAYS=7"
            echo "COOKIE_SECURE=false"
            echo "COOKIE_SAMESITE=lax"
            echo "COOKIE_DOMAIN="
            echo 'CORS_ORIGINS=["http://localhost:3000"]'
            echo "GRAFANA_PASSWORD=admin"
            echo "AWS_REGION=us-east-1"
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "S3_BUCKET_NAME=shopflow-test"
            echo "ANTHROPIC_API_KEY="
            echo "NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1"
          } > .env

      - name: Build and start backend + dependencies
        run: |
          docker compose up -d postgres redis backend
          echo "Waiting for backend to become healthy..."
          timeout 90 bash -c '
            until curl -sf http://localhost:8000/health; do
              sleep 3
            done
          '

      - name: Run Alembic migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Run API smoke tests
        run: ./scripts/smoke.sh

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── 8. Container Security Scan ─────────────────────────────────────────────
  security-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    needs: build-images
    # Don't block PRs on new vulns — reports go to the Security tab.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (local)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: shopflow-backend:scan
          cache-from: type=gha,scope=backend

      - name: Build frontend image (local)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: shopflow-frontend:scan
          cache-from: type=gha,scope=frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: shopflow-backend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: shopflow-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
