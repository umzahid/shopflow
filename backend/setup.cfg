[flake8]
max-line-length = 120
extend-ignore = E501,W503,E203
exclude =
    .git,
    __pycache__,
    alembic/versions,
    .venv,
    venv

[coverage:run]
# Operational CLI scripts (data seeding, embedding backfill) are run-once
# utilities, not application logic — exclude them from the coverage gate.
omit =
    app/scripts/*
